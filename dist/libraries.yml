# Drupal libraries of the components (generated by the assets build).
# Copy them into storybook_tw_base.libraries.yml: the templates attach them with
# {{ attach_library('storybook_tw_base/<name>') }}. Paths are relative to the theme
# root, assuming dist/ is at its root.

vendor-leaflet:
  js:
    dist/js/vendor/leaflet.js: {}

vendor-scrollcue:
  js:
    dist/js/vendor/scrollCue.js: {}

vendor-glightbox:
  js:
    dist/js/vendor/glightbox.js: {}

vendor-masonry:
  js:
    dist/js/vendor/masonry.pkgd.js: {}

animations:
  js:
    dist/js/components/animations.js: {}
  dependencies:
    - core/drupal
    - core/once
    - storybook_tw_base/vendor-scrollcue

masonry:
  js:
    dist/js/components/masonry.js: {}
  dependencies:
    - core/drupal
    - core/once
    - storybook_tw_base/vendor-masonry

tooltips:
  js:
    dist/js/components/tooltips.js: {}
  dependencies:
    - core/drupal
    - core/once

accordion:
  js:
    dist/js/components/accordion.js: {}
  dependencies:
    - core/drupal
    - core/once

alert:
  js:
    dist/js/components/alert.js: {}
  dependencies:
    - core/drupal
    - core/once

carousel:
  js:
    dist/js/components/carousel.js: {}
  dependencies:
    - core/drupal
    - core/once

image-lightbox:
  js:
    dist/js/components/image-lightbox.js: {}
  dependencies:
    - core/drupal
    - core/once
    - storybook_tw_base/vendor-glightbox

map:
  js:
    dist/js/components/map.js: {}
  dependencies:
    - core/drupal
    - core/once
    - storybook_tw_base/vendor-leaflet

modal:
  js:
    dist/js/components/modal.js: {}
  dependencies:
    - core/drupal
    - core/once
