name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run in progress (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails fast on peer dependency conflicts (e.g. a partial Vitest upgrade).
      - run: npm ci

      - run: npm run lint

      - run: npx playwright install --with-deps chromium

      # dist/ and public/ are versioned: they must match a fresh build.
      - run: npm run assets
      - name: Check that dist/ and public/ are up to date
        run: git diff --exit-code -- dist public

      - run: npm test

      - run: npm run build-storybook
